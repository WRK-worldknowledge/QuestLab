<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuestLab - SSR Check-In Quest</title>

<style>

body{
margin:0;
background:#0F172A;
color:#F8FAFC;
font-family:system-ui,sans-serif;
text-align:center;
padding:40px 20px;
}

.logo{
max-width:260px;
margin:20px auto;
display:block;
}

.icon{
font-size:80px;
margin-top:20px;
}

h1{
color:#F5CA51;
font-size:56px;
margin:10px 0;
}

.subtitle{
font-size:24px;
margin-bottom:20px;
opacity:.9;
}

.card{
max-width:700px;
margin:30px auto;
padding:30px;
background:#111E3A;
border:2px solid #F5CA51;
border-radius:24px;
}

.card h2{
color:#F5CA51;
margin-top:0;
}

.features{
text-align:left;
max-width:500px;
margin:0 auto;
line-height:2;
font-size:18px;
}

.backBtn{
display:inline-block;
margin-top:30px;
padding:14px 24px;
background:#F5CA51;
color:#0F172A;
text-decoration:none;
font-weight:700;
border-radius:14px;
}

.backBtn:hover{
transform:scale(1.03);
}
  .passengerCard,
.checkinCard{
    max-width:500px;
    margin:25px auto;
    padding:20px;
    background:#0B1430;
    border:1px solid #F5CA51;
    border-radius:20px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#1E293B;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
}

.speech{
    line-height:1.8;
    font-size:18px;
}

input{
    width:80%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin:15px 0;
    text-transform:uppercase;
    text-align:center;
    font-size:18px;
}

button{
    padding:12px 24px;
    background:#F5CA51;
    color:#0F172A;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#feedback{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

</style>
</head>
<body>

<img src="../../logo.png" class="logo">

<div class="icon">👨‍✈️</div>

<h1>SSR CHECK-IN QUEST</h1>

<div class="subtitle">
QuestLab Simulator
</div>
  <select id="category">

    <option value="all">
        Mixed Challenge
    </option>

    <option value="ssr">
        SSR
    </option>

    <option value="meals">
        Meals
    </option>

    <option value="baggage">
        Baggage
    </option>

    <option value="passenger">
        Passenger Services
    </option>

    <option value="operations">
        Operations
    </option>

    <option value="connections">
        Connections
    </option>

</select>

  <h2>Mission 1</h2>

<p>
Identify the correct SSR code for the passenger.
</p>
  
<div class="card">


  <div class="passengerCard">

   <div class="avatar" id="avatar"></div>

<div class="speech" id="speech"></div>

</div>

<div class="checkinCard">

    <h3>CHECK-IN SYSTEM</h3>

    <p><b>Name:</b> <span id="name"></span></p>
<p><b>Flight:</b> <span id="flight"></span></p>

    <input type="text" id="ssr1" placeholder="SSR Code">

    <button onclick="checkAnswer()">
        Check Answer
    </button>

  <div id="feedback"></div>

<p>XP: <span id="xp">0</span></p>

   <button onclick="nextPassenger()">
    Next Passenger
</button>

</div>
<script>

let answered = false;
let xp = 0;
 let passengers = [];
  let currentPassenger = 0;
  let mistakes = 0;
  let selectedCategory = "all";

  function loadPassenger(){

    document.getElementById("avatar").innerHTML =
         passengers[currentPassenger].avatar;

    document.getElementById("speech").innerHTML =
         passengers[currentPassenger].speech.join("<br>");

    document.getElementById("name").innerText =
         passengers[currentPassenger].name;

    document.getElementById("flight").innerText =
         passengers[currentPassenger].flight;

}
fetch(
    "data/" +
    selectedCategory +
    ".json"
)
    .then(response => response.json())
    .then(data => {

    passengers = data.passengers;

    loadPassenger();

});
  function nextPassenger(){

    currentPassenger++;

    if(currentPassenger >= passengers.length){

        currentPassenger = 0;

    }

    answered = false;
mistakes = 0;
    
    document.getElementById("ssr1").value = "";

    document.getElementById("feedback").innerHTML = "";

    loadPassenger();

}

function checkAnswer(){

    if(answered) return;

    let answer =
        document
        .getElementById("ssr1")
        .value
        .toUpperCase();

    if(
    passengers[currentPassenger]
        .answers
        .includes(answer)
){

        xp += 3;
answered = true;

addXP(3);


document.getElementById("xp").innerText = xp;
        document.getElementById("feedback").innerHTML =
            "✅ Correct! +3 XP";

    } else {

    mistakes++;

    if(mistakes === 1){

        addXP(-1);

        document.getElementById("feedback").innerHTML =
            "❌ Try again. -1 XP";

    }

    if(mistakes === 2){

        addXP(-2);

        document.getElementById("feedback").innerHTML =
            "❌ Try again. -2 XP";

    }

    if(mistakes === 3){

        addXP(-3);

        document.getElementById("feedback").innerHTML =
            "Correct answer: " +
            passengers[currentPassenger].answers[0];

        setTimeout(nextPassenger, 3000);

    }
}


}

document
    .getElementById("ssr1")
    .addEventListener("keypress", function(event){

        if(event.key === "Enter"){
            checkAnswer();
        }

    });
document
    .getElementById("category")
    .addEventListener("change", function(){

        selectedCategory = this.value;

        fetch(
            "data/" +
            selectedCategory +
            ".json"
        )
        .then(response => response.json())
        .then(data => {

            passengers = data.scenarios;

            currentPassenger = 0;

            loadPassenger();

        });

    });
</script>
</div>
<a href="../../index.html" class="backBtn">
← Back to QuestLab
</a>
<script src="../../player.js"></script>
</body>
</html>
