<!DOCTYPE html>
<html>
    
<head>
   
<meta charset="UTF-8">
<title>QuestLab - Mission Select</title>

<style>
body{
    background:#0F172A;
    color:white;
    font-family:system-ui;
    text-align:center;
    padding:40px;
}
    .logo{
    max-width:260px;
    margin:20px auto;
    display:block;
}
select{
    width:340px;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
}

button{
    width:340px;
    padding:15px;
    background:#F5CA51;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    font-size:18px;
}
    .backBtn{
    display:block;
    margin-top:30px;
    color:white;
    text-decoration:none;
}
    h1{
    color:white;
    font-size:56px;
    margin-bottom:10px;
}
</style>
</head>

<body>
<img src="../../logo.png" class="logo">

<h1>SSR CHECK-IN QUEST</h1>

<p>
Select your training mission.
</p>
<h2>Select Mission</h2>

<select id="mission">
    <option value="all">Mixed Challenge</option>
    <option value="ssr">SSR Specialist</option>
    <option value="meals">Meal Expert</option>
    <option value="baggage">Baggage Agent</option>
    <option value="passenger">Passenger Services</option>
    <option value="operations">Operations Officer</option>
    <option value="connections">Connections Expert</option>
</select>
    <br><br>

<button onclick="startMission()">
    Start mission
</button>
<script>

function startMission(){

    localStorage.setItem(
        "questCategory",
        document.getElementById(
            "mission"
        ).value
    );

    window.location.href =
        "index.html";
}

</script>
<a href="../../index.html" class="backBtn">
← Back to QuestLab
</a>
</body>
</html>
