<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IATA Match & Learn</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#0F172A;
color:#F8FAFC;
text-align:center;
}

h1{
margin-top:30px;
}

#setup{
max-width:420px;
margin:30px auto;
}

select, button{
width:100%;
padding:14px;
margin:10px 0;
border-radius:12px;
border:none;
font-size:18px;
}

button{
background:#F5CA51;
color:#0F172A;
font-weight:700;
cursor:pointer;
}

button:hover{
transform:scale(1.02);
}

.backBtn{
position:fixed;
top:14px;
left:14px;
background:#0F172A;
color:white;
border:2px solid #F5CA51;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

</style>
</head>

<body>

<button class="backBtn" onclick="location.href='../../index.html'">
← Back
</button>

<h1>IATA Match & Learn</h1>

<div id="setup">

<label>Mode</label>
<select id="modeSelect">
<option value="training">Training</option>
<option value="exam">Exam</option>
</select>

<label>Module</label>
<select id="moduleSelect"></select>

<label>Lesson</label>
<select id="lessonSelect"></select>

<button id="startBtn">Start mission</button>

</div>

<script src="setup.js"></script>

</body>
</html>
