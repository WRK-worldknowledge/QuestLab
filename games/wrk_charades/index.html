
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WRK Charades</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../help/help.css">
  <style>
.back-wrapper{
  display:flex;
  justify-content:center;
  margin:30px 0 10px 0;
}

.back-btn{
  background:#F5CA51;
  color:#0F172A;
  border:none;
  padding:18px 28px;
  border-radius:18px;
  font-size:18px;
  font-weight:700;
  width:280px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:all 0.2s ease;
}

.back-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(0,0,0,0.4);
}
  </style>
</head>
<body>
<div class="back-wrapper">
  <button class="game-btn back-btn" onclick="location.href='../../index.html'">
    ← Back to Game Console
  </button>
</div>
<div id="start">
 <img src="../../logo.png" class="logo">
  <h1>WRK Charades</h1>
  <h3>Game Type</h3>
  <label><input type="radio" name="gameType" checked onclick="setGameType('code-to-city')"> Guess the city</label><br>
  <label><input type="radio" name="gameType" onclick="setGameType('city-to-code')"> Guess the IATA code</label>
  <h3>Mode</h3>
  <button onclick="setMode('train')">Training</button>
  <button onclick="setMode('exam')">Exam</button>
  <div id="modules"></div>
  <button class="startBtn" onclick="startGame()">Start</button>
</div>

<div id="game" class="hidden">
  <div id="timer"></div>
  <div id="code"></div>
</div>

<div id="hint" class="hidden"></div>

<div id="end" class="hidden">
  <h2>Time's up!</h2>
  <p id="score"></p>
  <button onclick="resetGame()">Restart</button>
</div>

<script src="../help/help.js"></script>
  <script src="../../player.js"></script>
<script src="app.js"></script>
</body>
</html>
