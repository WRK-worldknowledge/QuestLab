<!DOCTYPE html>

<html>
<head>
    <title>QuestLab Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js/supabase.js"></script>
</head>

<body>

<h1>QuestLab Login</h1>

<input id="email" placeholder="Email">

<input
    id="password"
    type="password"
    placeholder="Password">

<button onclick="login()">
    Login
</button>

<script>

async function login() {

    const email =
    document.getElementById(
        'email'
    ).value;
    
    const { data, error } =
        await client.auth.signInWithPassword({

       email: email,

        password:
            document.getElementById(
                'password'
            ).value

    });

    if(error){

        alert(error.message);

    } else {

    let role = "student";

    if(email.endsWith("@rebergen.org")){
        role = "admin";
    }

    await client
        .from('users')
        .upsert({
            email: email,
            role: role,
            last_login: new Date()
        });

    window.location =
        'dashboard.html';

}
}

</script>

</body>
</html>
