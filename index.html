<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuestLab</title>
<style>
body {
  background: #0F172A;
  color: #F8FAFC;
  font-family: system-ui, sans-serif;
  text-align: center;
  padding-top: 60px;
  margin: 0;
}

.main-logo {
  display: block;
  max-width: 180px;
  margin: 20px auto 10px auto;

}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  text-align:center;
  opacity: 0.8;
  margin-bottom: 30px;
}

.button {
  display: block;
  width: 280px;
  margin: 14px auto;
  padding: 18px;
  background: #F5CA51;
  color: #0F172A;
  font-size: 20px;
  font-weight: 700;
  border-radius: 16px;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.45);
}

.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  opacity: 0.5;
  font-size: 13px;
}
 
  .playerCard{
    background:linear-gradient(145deg,#0F172A,#111E3A);
    border:3px solid #F5CA51;
    border-radius:20px;
    padding:14px 16px;
    width:280px;
    margin:20px auto 10px auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.playerRow{
display:flex;
align-items:center;
gap:12px;
}
.badgeCol{
display:flex;
align-items:center;
}

.badge{
height:70px;
width:auto;
object-fit:contain;
}

.rankCol{
display:flex;
flex-direction:column;
align-items:flex-start;
line-height:1.2;
}

.rankText{
    font-weight:600;
    font-size:15px;
    color:#F5CA51;
}

.xpText{
    font-size:12px;
    opacity:0.7;
    margin-top:2px;
}

.nameCol{
margin-left:auto;
font-weight:700;
font-size:18px;
}

  .games-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
max-width:700px;
margin:30px auto;
}

.game-btn{
background:#F5CA51;
color:#0F172A;
border:none;
border-radius:18px;
padding:28px 20px;
font-size:22px;
font-weight:700;
cursor:pointer;
width:100%;
transition:all .15s ease;
}

.game-btn:hover{
transform:scale(1.03);
}
  @media (max-width:600px){

.games-grid{
grid-template-columns:1fr;
max-width:320px;
}

}
</style>
</head>
<body>
  <div id="playerCard" class="playerCard"></div>

<img class="logo main-logo" src="logo.png" alt="QuestLab logo">

<div class="subtitle">Learning through play</div>

<div class="games-grid">

<button class="game-btn" onclick="location.href='games/topo/'">
🌍 WRK Topo Quiz
</button>

  <button class="game-btn" onclick="location.href='games/AIRIMP-match-learn/'">
✈️ AIRIMP Match & Learn
</button>
  
<button class="game-btn" onclick="location.href='games/match-learn/'">
🧩 WRK IATA Match & Learn
</button> 

  <button class="game-btn" onclick="location.href='games/Airline%20Message%20Builder/'">
📨 Airline Message Builder
</button>
  
<button class="game-btn" onclick="location.href='games/wrk_charades/'">
🧭 WRK Charades
</button>


<button class="game-btn" onclick="location.href='games/airimp_charades/'">
✈️ AIRIMP Charades
</button>

</div>
  
<div class="footer">© QuestLab</div>
<!-- eerst runtime variabele -->
<script>
const QUESTLAB_TOKEN_RUNTIME = "";
</script>

<!-- daarna player engine -->
<script src="player.js"></script>
</body>
</html>
