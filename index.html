<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuestLab</title>
<style>
body {
  background: #0F172A;
  color: #F8FAFC;
  font-family: system-ui, sans-serif;
  text-align: center;
  padding-top: 60px;
  margin: 0;
}

.main-logo {
  display: block;
  max-width: 180px;
  margin: 20px auto 10px auto;

}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  text-align:center;
  opacity: 0.8;
  margin-bottom: 30px;
}

.button {
  display: block;
  width: 280px;
  margin: 14px auto;
  padding: 18px;
  background: #F5CA51;
  color: #0F172A;
  font-size: 20px;
  font-weight: 700;
  border-radius: 16px;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.45);
}

.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  opacity: 0.5;
  font-size: 13px;
}
 
  .playerCard{
    background:linear-gradient(145deg,#0F172A,#111E3A);
    border:3px solid #F5CA51;
    border-radius:20px;
    padding:14px 16px;
    width:280px;
    margin:20px auto 10px auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.playerRow{
display:flex;
align-items:center;
gap:12px;
}
.badgeCol{
display:flex;
align-items:center;
}

.badge{
height:70px;
width:auto;
object-fit:contain;
}

.rankCol{
display:flex;
flex-direction:column;
align-items:flex-start;
line-height:1.2;
}

.rankText{
    font-weight:600;
    font-size:15px;
    color:#F5CA51;
}

.xpText{
    font-size:12px;
    opacity:0.7;
    margin-top:2px;
}

.nameCol{
margin-left:auto;
font-weight:700;
font-size:18px;
}

  .games-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
max-width:700px;
margin:30px auto;
}

.game-btn{
background:#F5CA51;
color:#0F172A;
border:none;
border-radius:18px;
padding:28px 20px;
font-size:22px;
font-weight:700;
cursor:pointer;
width:100%;
transition:all .15s ease;
}

.game-btn:hover{
transform:scale(1.03);
}
@media (max-width:600px){

    .games-grid{
        grid-template-columns:1fr;
        max-width:320px;
    }

    #loginModal > div{
        width:85vw !important;
        padding:25px 20px !important;
        margin:80px auto !important;
        border-width:4px !important;
    }

    #loginModal img{
        width:80px !important;
    }

    #loginModal h2{
        font-size:32px !important;
    }

    #loginModal p{
        font-size:16px !important;
        line-height:1.4;
    }

    #loginEmail{
        width:85% !important;
    }
  .button{

    width:140px !important;
    padding:12px !important;
    font-size:16px !important;
    margin:0 !important;
}

.button + .button{
    margin-left:10px;
}
  #topButtons{

    gap:10px !important;
    margin-bottom:20px !important;
}
}
</style>
</head>
<body>
  <div id="playerCard" class="playerCard"></div>

<img class="logo main-logo" src="logo.png" alt="QuestLab logo">

<div class="subtitle">Learning through play</div>

 <div id="topButtons" style="
display:flex;
gap:15px;
justify-content:center;
margin-bottom:20px;
">

    <button
        class="button"
        style="width:220px;"
        onclick="playDemo()">

        🎮 PLAY DEMO

    </button>

    <button
        class="button"
        style="width:220px;"
        onclick="showLogin()">

        🎓 STUDENT LOGIN

    </button>

</div>

<div class="games-grid">

<button class="game-btn" onclick="launchGame('games/topo/')">
🌍 Topo Quest
</button>

  <button class="game-btn" onclick="launchGame('games/AIRIMP-match-learn/')">
✈️ AIRIMP QuestMatch
</button>
  
<button class="game-btn" onclick="launchGame('games/match-learn/')">
🧩 IATA Code QuestMatch
</button> 

  <button class="game-btn" onclick="launchGame('games/Airline%20Message%20Builder/')">
📨 Airline Message Quest
</button>
  
<button class="game-btn" onclick="launchGame('games/wrk_charades/')">
🧭 IATA Code Charades
</button>


<button class="game-btn" onclick="launchGame('games/airimp_charades/')">
🛩️ AIRIMP Charades
</button>

  <button class="game-btn"
        onclick="launchGame('games/airline-quest/')">
🛬 Airline QuestMatch
</button>

</div>

  <div id="loginModal"
     style="
     display:none;
     position:fixed;
     top:0;
     left:0;
     width:100%;
     height:100%;
     background:rgba(0,0,0,0.8);
     ">

    <div style="
    width:min(360px, 85vw);
     margin:120px auto;
     background:#0F172A;
     padding:40px;
     border-radius:24px;
     border:5px solid #F5CA51;
     text-align:center;
     box-shadow:0 20px 60px rgba(0,0,0,0.6);
     ">

    <img
        src="logo.png"
        style="width:100px;margin-bottom:15px;">

    <h2 style="
        color:#F5CA51;
        margin-top:0;
        margin-bottom:10px;
    ">
        QuestLab Login
    </h2>

    <p style="
        opacity:.8;
        margin-bottom:25px;
    ">
        Enter your TALNET email address to
        continue.
    </p>

    <input
        id="loginEmail"
        placeholder="123456@talnet.nl"
        style="
            width:90%;
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:16px;
            margin-bottom:20px;
        ">

    <br>

    <button
        onclick="studentLogin()"
        style="
            background:#F5CA51;
            color:#0F172A;
            border:none;
            padding:14px 28px;
            border-radius:12px;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
            width:100%;
        ">
        Continue
    </button>

    </div>

</div>
  
<div class="footer">© QuestLab</div>
<!-- eerst runtime variabele -->
<script>
const QUESTLAB_TOKEN_RUNTIME = "";
</script>
  
<script>
let currentUser =
    localStorage.getItem(
        "questlabUser"
    );

let loggedIn =
    currentUser !== null;
</script>
  
<!-- daarna player engine -->
<script src="player.js"></script>

  <script>
function launchGame(url){

    const isMobile =
        /Android|iPhone|iPad|iPod/i
        .test(navigator.userAgent);

    if(
        (
            url.includes("wrk_charades") ||
            url.includes("airimp_charades")
        )
        && !isMobile
    ){

        alert(
            "This game is only available on mobile devices.\n\n" +
            "Please open QuestLab on your phone to play Charades."
        );

        return;
    }

    if(!loggedIn){

        alert(
            "Please select:\n\n" +
            "• PLAY DEMO\n" +
            "• STUDENT LOGIN"
        );

        return;
    }

    location.href = url;
}
    function studentLogin(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value;

    if(
        !email.endsWith("@talnet.nl") &&
        !email.endsWith("@rebergen.org")
    ){
        alert(
            "Please use a TALNET or personal demo email address."
        );
        return;
    }

    loggedIn = true;
currentUser = email;

localStorage.setItem(
    "questlabUser",
    email
);

document.getElementById(
    "loginModal"
).style.display = "none";

    alert(
        "Welcome back!"
    );
}
    function playDemo(){

    loggedIn = true;
    currentUser = "guest";

    localStorage.setItem(
        "questlabUser",
        "guest"
    );

    alert(
        "Welcome Guest Pilot!\n\n" +
        "Demo mode activated."
    );
}

function showLogin(){

    document.getElementById(
        "loginModal"
    ).style.display = "block";
}
</script>
</body>
</html>
