<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuestLab</title>
<style>
body {
  background: #0F172A;
  color: #F8FAFC;
  font-family: system-ui, sans-serif;
  text-align: center;
  padding-top: 60px;
  margin: 0;
}

.main-logo {
  display: block;
  max-width: 180px;
  margin: 20px auto 10px auto;

}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  text-align:center;
  opacity: 0.8;
  margin-bottom: 30px;
}

.button {
  display: block;
  width: 280px;
  margin: 14px auto;
  padding: 18px;
  background: #F5CA51;
  color: #0F172A;
  font-size: 20px;
  font-weight: 700;
  border-radius: 16px;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(0,0,0,0.45);
}

.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  opacity: 0.5;
  font-size: 13px;
}
  .playerCard{
    background:linear-gradient(145deg,#0F172A,#111E3A);
    border:3px solid #F5CA51;
    border-radius:20px;
    padding:16px;
    width:280PX;
    margin:30px auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
  .playerRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

.playerLeft{
    font-weight:700;
    font-size:18px;
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
  
.playerRight{
  text-align:right;
}
  .rankLine{
    font-weight:600
      font-size:14px;
    color:#F5CA51;
    display:flex;
    align-items:center;
    gap:6xp;
    justify-content:flex-end;
  }
  
  .badge{
    width:24px;
  }
  
.xpLine{
    font-size:12px;
  opacity:0.7;
  margin-top:2px;
}
  
  .game-buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    margin-top:40px;
  }

  .game-btn{
    background:#F5CA51;
    color:#0F172A;
    border:none;
    padding:18px 28px;
    border-radius:18px;
    font-size:18px;
    font-weight:700;
    width:280px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    transition:all 0.2 ease;
  }

  .game-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(0,0,0,0.4);
  }
  
</style>
</head>
<body>
  <div id="playerCard" class="playerCard"></div>

<img class="logo main-logo" src="logo.png" alt="QuestLab logo">

<div class="subtitle">Learning through play</div>

<div class="game-buttons">
<button class="game-btn" onclick="location.href='games/topo/'"> 🌍 WRK Topo Quiz</button>
<button class="game-btn" onclick="location.href='games/wrk_charades/'"> 🧭 WRK Charades</button>
<button class="game-btn" onclick="location.href='games/airimp_charades/'"> ✈️ AIRIMP Charades</button>
</div>
  
<div class="footer">© QuestLab</div>
<!-- eerst runtime variabele -->
<script>
const QUESTLAB_TOKEN_RUNTIME = "";
</script>

<!-- daarna player engine -->
<script src="player.js"></script>
</body>
</html>
